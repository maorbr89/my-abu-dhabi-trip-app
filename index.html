<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אבו דאבי - אפליקציית חופשה משפחתית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>אבו דאבי - חופשה משפחתית מורחבת</h1>
            <p>10.11.2026 – 16.11.2026 | מלון The WB Abu Dhabi (חצי פנסיון)</p>
            <p style="margin-top: 4px; font-size: 0.85rem; opacity: 0.85;">PNR הזמנת טיסה: <strong>9XO92L</strong></p>
        </div>

        <!-- Top Navigation Tabs -->
        <div class="nav-tabs" id="top-tabs">
            <button class="tab-btn active" onclick="switchSection('flights-sec')">✈️ טיסות וכבודה</button>
            <button class="tab-btn" onclick="switchSection('day1')">שלישי 10.11</button>
            <button class="tab-btn" onclick="switchSection('day2')">רביעי 11.11</button>
            <button class="tab-btn" onclick="switchSection('day3')">חמישי 12.11</button>
            <button class="tab-btn" onclick="switchSection('day4')">שישי 13.11</button>
            <button class="tab-btn" onclick="switchSection('day5')">שבת 14.11</button>
            <button class="tab-btn" onclick="switchSection('day6')">ראשון 15.11</button>
            <button class="tab-btn" onclick="switchSection('day7')">שני 16.11</button>
            <button class="tab-btn" onclick="switchSection('shabbat-sec')">🕌 שבת וכשרות</button>
            <button class="tab-btn" onclick="switchSection('links-sec')">📍 אטרקציות וניווט</button>
        </div>

        <!-- Dynamic Content Sections inserted by JavaScript -->
        <main id="main-content"></main>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav" id="bottom-nav">
        <button class="bottom-nav-btn active" onclick="switchSection('day1'); setActiveNav(this)">
            <span class="icon">📅</span>
            <span>לו"ז יומי</span>
        </button>
        <button class="bottom-nav-btn" onclick="switchSection('flights-sec'); setActiveNav(this)">
            <span class="icon">✈️</span>
            <span>טיסות</span>
        </button>
        <button class="bottom-nav-btn" onclick="switchSection('links-sec'); setActiveNav(this)">
            <span class="icon">📍</span>
            <span>אטרקציות</span>
        </button>
        <button class="bottom-nav-btn" onclick="switchSection('shabbat-sec'); setActiveNav(this)">
            <span class="icon">🕌</span>
            <span>שבת</span>
        </button>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
