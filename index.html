<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אבו דאבי - אפליקציית חופשה משפחתית</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #0284c7;
            --accent: #f59e0b;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius: 14px;
            --split-bg: #f0fdf4;
            --split-border: #bbf7d0;
            --hotel-bg: #fff7ed;
            --hotel-border: #fed7aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Assistant', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #0f172a 100%);
            color: white;
            padding: 24px 16px;
            text-align: center;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* App Tabs Bar */
        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 12px 2px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Cards */
        .section-card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
