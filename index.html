<script>
        let currentCategory = 'home';
        let isNavigatingHistory = false; // דגל למניעת כפילות בעת ניווט היסטוריה

        function updateTopTabs() {
            const tabs = document.getElementById('top-tabs');
            tabs.style.display = currentCategory === 'daily' ? 'flex' : 'none';
        }

        function setBottomActive(category) {
            document.querySelectorAll('.bottom-nav-btn').forEach((btn, index) => {
                btn.classList.toggle('active', ['home','daily','flights','attractions','shabbat'][index] === category);
            });
        }

        function showSection(id) {
            document.querySelectorAll('.section-card').forEach(sec => sec.classList.remove('active-section'));
            const target = document.getElementById(id);
            if (target) target.classList.add('active-section');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchCategory(category, pushToHistory = true) {
            currentCategory = category;
            setBottomActive(category);
            updateTopTabs();
            const section = { home: 'home-sec', daily: 'day1', flights: 'flights-sec', attractions: 'links-sec', shabbat: 'shabbat-sec' }[category];
            showSection(section);
            if (category === 'daily') setDayActive('day1');

            // שמירת המצב בהיסטוריית הדפדפן
            if (pushToHistory && !isNavigatingHistory) {
                history.pushState({ type: 'category', category: category, section: section }, '', '#' + category);
            }
        }

        function switchDay(id, pushToHistory = true) {
            if (currentCategory !== 'daily') return;
            showSection(id);
            setDayActive(id);

            // שמירת יום ספציפי בהיסטוריה
            if (pushToHistory && !isNavigatingHistory) {
                history.pushState({ type: 'day', dayId: id }, '', '#' + id);
            }
        }

        function setDayActive(id) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(`switchDay('${id}')`));
            });
        }

        function toggleDetails(btn) {
            const details = btn.nextElementSibling;
            if (details.style.display === 'block') {
                details.style.display = 'none';
                btn.innerHTML = '📖 מידע מלא ▾';
            } else {
                details.style.display = 'block';
                btn.innerHTML = 'סגור מידע ▴';
            }
        }

        function jumpToAttraction(attrId, pushToHistory = true) {
            const previousState = { type: 'category', category: currentCategory, section: document.querySelector('.section-card.active-section')?.id };
            
            switchCategory('attractions', false);

            setTimeout(() => {
                const card = document.getElementById(attrId);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    card.classList.add('highlight');
                    const detailsBtn = card.querySelector('.toggle-details-btn');
                    const detailsBox = card.querySelector('.attraction-details');
                    if (detailsBox && detailsBox.style.display !== 'block') {
                        detailsBox.style.display = 'block';
                        if (detailsBtn) detailsBtn.innerHTML = 'סגור מידע ▴';
                    }
                    setTimeout(() => card.classList.remove('highlight'), 2500);

                    // שמירת הקפיצה לאטרקציה בהיסטוריית הניווט
                    if (pushToHistory && !isNavigatingHistory) {
                        history.pushState({ type: 'attraction', attrId: attrId }, '', '#' + attrId);
                    }
                }
            }, 100);
        }

        // האזנה ללחיצה על כפתור "חזור / קדימה" בדפדפן ובמכשיר הנייד
        window.addEventListener('popstate', (event) => {
            isNavigatingHistory = true;
            if (event.state) {
                const state = event.state;
                if (state.type === 'category') {
                    switchCategory(state.category, false);
                } else if (state.type === 'day') {
                    if (currentCategory !== 'daily') switchCategory('daily', false);
                    switchDay(state.dayId, false);
                } else if (state.type === 'attraction') {
                    jumpToAttraction(state.attrId, false);
                }
            } else {
                // חזרה לברירת המחדל (דף ראשי)
                switchCategory('home', false);
            }
            isNavigatingHistory = false;
        });

        document.addEventListener('DOMContentLoaded', () => {
            currentCategory = 'home';
            setBottomActive('home');
            updateTopTabs();
            showSection('home-sec');

            // הגדרת מצב התחלתי להיסטוריה
            history.replaceState({ type: 'category', category: 'home', section: 'home-sec' }, '', '#home');
        });
</script>
